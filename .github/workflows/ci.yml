name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    name: Hermetic Control-Plane Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --no-deps .

      - name: Check git diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Check JavaScript syntax
        run: |
          node --check src/portfolio_suites/web/app.js
          node --check src/portfolio_suites/adapters/donor_wcag_331_browser_probe.mjs

      - name: Run fast portfolio validation
        run: PYTHONPATH=src python3 -m portfolio_suites validate --fast

      - name: Run hermetic unit and boundary tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest \
            tests.test_approvals \
            tests.test_chain_preflight \
            tests.test_contract_keyword_validation \
            tests.test_contracts \
            tests.test_docs \
            tests.test_engine_action_json_boundary \
            tests.test_engine_actions \
            tests.test_integrity_boundaries \
            tests.test_lab_engine_hardening \
            tests.test_mutation_confinement \
            tests.test_provenance \
            tests.test_provenance_strictness \
            tests.test_execution_trace \
            tests.test_recovery_api \
            tests.test_recovery_cli \
            tests.test_recovery_lifecycle_receipts \
            tests.test_recovery_program \
            tests.test_recovery_registry_integration \
            tests.test_server \
            tests.test_source_root \
            tests.test_txn \
            tests.test_web_security

  portfolio-integration:
    name: Portfolio Integration (Manual, Provisioned Runner)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, suites-portfolio]

    steps:
      - name: Checkout suites beside the provisioned donor portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: suites

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the provisioned portfolio and run the complete milestone matrix
        working-directory: suites
        env:
          SUITES_WHEEL_SMOKE: "1"
        run: |
          PYTHONPATH=src python -m portfolio_suites validate
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests
