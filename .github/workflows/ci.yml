name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deterministic Gates & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Check git diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Check JavaScript syntax
        run: |
          node --check src/portfolio_suites/web/app.js
          node --check src/portfolio_suites/adapters/donor_wcag_331_browser_probe.mjs

      - name: Run fast portfolio validation
        run: PYTHONPATH=src python3 -m portfolio_suites validate --fast

      - name: Run test suite
        env:
          SUITES_WHEEL_SMOKE: "1"
        run: PYTHONPATH=src pytest
