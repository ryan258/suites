[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryan-project-suites"
version = "0.1.0"
description = "Portfolio contracts, provenance, and migration control for Ryan's project suites."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
suites = "portfolio_suites.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
portfolio_suites = ["web/*", "adapters/*.mjs", "adapters/*.py"]

[tool.setuptools.packages.find]
where = ["src"]
